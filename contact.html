<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Gabriel Schkolnick</title>
  <meta name="description" content="Contact Gabriel Schkolnick, photographer and director." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <a href="index.html" class="logo">Gabriel Schkolnick</a>
    <nav class="main-nav" aria-label="Navegación principal">
      <a href="index.html">Photographers</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <main>
    <section class="contact-section">
      <div class="contact-intro">
        <h1>Contact</h1>
        <p>
          For bookings, collaborations, or just to say hello.
        </p>
      </div>

      <div class="contact-details">
        <a href="mailto:pablo@schkolnick.com">pablo@schkolnick.com</a>
        <a href="tel:+56222055050">+56 2 2205 5050</a>
      </div>

      <p style="text-align:center;color:var(--text-muted);margin-bottom:3rem;">
        Estudio: Caupolicán 1050, Providencia, Santiago, Chile.
      </p>

      <form class="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />

        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" />

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" required></textarea>

        <button type="submit">Send message</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-left">
      <p>&copy; <span id="year"></span> Gabriel Schkolnick</p>
      <p class="footer-tagline">Fotógrafo & Director</p>
    </div>
    <div class="social-links">
      <a href="https://www.instagram.com/gabrielschkolnick/" aria-label="Instagram" target="_blank" rel="noopener">Instagram</a>
      <a href="https://vimeo.com/user127092469" aria-label="Vimeo" target="_blank" rel="noopener">Vimeo</a>
      <a href="mailto:pablo@schkolnick.com">Email</a>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
