<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Conversaciones de Copilot</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">GitHub Copilot CLI</p>
        <h1>Tus conversaciones</h1>
      </div>
      <span id="conversation-count" class="count">Cargando...</span>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <label class="search">
          <span>Buscar en todas las conversaciones</span>
          <input id="search-input" type="search" placeholder="Proyecto, mensaje o respuesta" autocomplete="off">
        </label>
        <div id="conversation-list" class="conversation-list" aria-live="polite"></div>
      </aside>

      <section id="detail" class="detail" aria-live="polite">
        <div class="empty-state">
          <h2>Selecciona una conversación</h2>
          <p>Consulta sus mensajes, respuestas y datos del proyecto.</p>
        </div>
      </section>
    </main>

    <template id="conversation-item-template">
      <button class="conversation-item" type="button">
        <strong class="conversation-title"></strong>
        <span class="conversation-meta"></span>
        <span class="conversation-date"></span>
      </button>
    </template>

    <template id="turn-template">
      <article class="turn">
        <div class="message user-message">
          <span class="message-label">Tú</span>
          <pre class="user-content"></pre>
        </div>
        <div class="message assistant-message">
          <span class="message-label">Copilot</span>
          <pre class="assistant-content"></pre>
        </div>
      </article>
    </template>

    <script src="/app.js" defer></script>
  </body>
</html>
